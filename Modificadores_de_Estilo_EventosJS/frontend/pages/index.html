<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="/Modificadores_de_Estilo_EventosJS/frontend/scripts/script.js" defer></script>
</head>
<body>
    <header>
            <h1 id="titulo">Loja da Turma</h1>
            <button id="btn-tema">Modo escuro</button>
        </header>
        <main>
            <section class="produto" id="produto-1">
                <h2>Caneca Personalizada</h2>
                <p class="preco">R$ 29,90</p>
                <button id="btn-favoritar-1">Favoritar</button>
            </section>
            <section class="produto" id="produto-2">
                <h2>Camiseta Dev</h2>
                <p class="preco">R$ 59,90</p>
                <button id="btn-favoritar-2">Favoritar</button>
            </section>
            <div id="caixa-mensagem" class="escondido">
                Mensagem aparece aqui
            </div>
            <img id="imagem-produto" src="https://via.placeholder.com/150" alt="Produto em destaque">

            <form id="form-contato">
                <label for="campo-email">Seu e-mail: </label>
                <input type="email" id="campo-email" placeholder="nome@email.com">
                <button type="submit">Enviar</button>
            </form>
            
            <p id="feedback-form"></p>
            <input type="text" id="campo-busca" placeholder="Digite para buscar...">
            <p id="resultado-busca"></p>
        </main>
</body>
</html>
